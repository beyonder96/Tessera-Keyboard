name: Build APK (CI)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'apks/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'apks/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Stage APK artifacts
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apks/app-release.apk
          ls -lh dist-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tessera-keyboard-apks
          path: dist-apks/*.apk
          retention-days: 14
