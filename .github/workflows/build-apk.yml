name: Build APK (CI)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'apks/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'apks/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Stage APK artifacts
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apks/app-release.apk
          ls -lh dist-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tessera-keyboard-apks
          path: dist-apks/*.apk
          retention-days: 14
